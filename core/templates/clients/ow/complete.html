{% extends "clients/ow/base.html" %}
{% block title %}We couldn't connect your wearable{% endblock %}

{% block pf_content %}
<div class="pf-error" aria-live="polite">
  <div class="pf-error__icon"><i class="bi bi-exclamation-circle"></i></div>
  <div class="pf-error__body">
    <div class="pf-error__title">We couldn't connect your wearable</div>
    <p class="pf-error__msg">{{ error }}</p>
  </div>
</div>
<div class="pf-actions">
  <a class="pf-btn" href="{% url 'ow-launch' %}">Try again</a>
  <a class="pf-btn pf-btn--ghost" href="{% url 'patient-landing' %}">Back</a>
</div>
{% endblock %}
