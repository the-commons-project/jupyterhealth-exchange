{% verbatim %}
<script id="t-ehr-vendors" type="text/template">

  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col"></th>
        <th scope="col">ID</th>
        <th scope="col">Name</th>
        <th scope="col">Client ID</th>
        <th scope="col">Supported Scopes</th>
        <th scope="col">Skip JHE Checklist</th>
        <th scope="col">Extra Scopes</th>
        <th scope="col">SMART Scopes</th>
        <th scope="col">Query Overrides</th>
      </tr>
    </thead>
    <tbody>
      {{#ehrVendors}}
        <tr>
          <td>
            {{> crudButton iconRead=true recordId=id
              onclick="nav('ehrs',{
                id: this.dataset.recordid,
                read: true
              })"
            }}
            {{#if @root.canManageEhrVendors }}
                {{> crudButton iconUpdate=true recordId=id
                  onclick="nav('ehrs',{
                    id: this.dataset.recordid,
                    update: true
                  })"
                }}

                {{> crudButton iconDelete=true recordId=id
                  onclick="nav('ehrs',{
                    id: this.dataset.recordid,
                    delete: true
                  })"
                }}
            {{/if}}
          </td>
          <td>{{id}}</td>
          <td>{{name}}</td>
          <td>{{ehrClientId}}</td>
          <td>
            <ul>
            {{#each scopeLabels}}
              <li>{{this}}</li>
            {{/each}}
            </ul>
          </td>
          <td>{{#if skipTypeChecklist}}Yes{{else}}No{{/if}}</td>
          <td>{{extraScopes}}</td>
          <td>{{scopeVersion}}</td>
          <td>
            <ul>
            {{#each queryOverrides}}
              <li>{{row}}</li>
            {{/each}}
            </ul>
          </td>
        </tr>
      {{/ehrVendors}}
    </tbody>
  </table>
  {{#if @root.canManageEhrVendors }}
  <button type="button"
      class="btn btn-sm btn-success"
      onclick="nav('ehrs',{
          create: true
      })">
  Add EHR Vendor
  </button>
  {{/if}}

  <!-- MODAL -->
  <div
    class="modal fade"
    id="ehrs-crudModal"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">
            {{#if create}} Create EHR Vendor {{/if}}
            {{#if read}} View EHR Vendor {{/if}}
            {{#if update}} Update EHR Vendor {{/if}}
            {{#if delete}} Delete EHR Vendor {{/if}}
          </h1>
          <button
            type="button"
            class="btn-close"
            onclick="navReturnFromCrud()"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning validationError" style="display: none" role="alert"></div>
          <div class="container-fluid">
            {{#if delete}}
              <div class="alert alert-danger" role="alert">
                Are you sure you want to delete this entire record?
              </div>
            {{/if}}
            <form>
              <fieldset {{#if read }} disabled {{/if}} {{#if delete }} disabled {{/if}}>
                {{#unless create}}
                  <div class="mb-3">
                    <fieldset disabled>
                      <label for="ehrVendorId" class="form-label"
                        >ID</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="ehrVendorId"
                        value="{{ehrVendorRecord.id}}"
                      />
                    </fieldset>
                  </div>
                {{/unless}}
                <div class="mb-3">
                  <label for="ehrVendorName" class="form-label"
                    >Name*</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="ehrVendorName"
                    value="{{ehrVendorRecord.name}}"
                  />
                </div>
                <div class="mb-3">
                  <label for="ehrVendorEhrClientId" class="form-label"
                    >EHR Client ID</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="ehrVendorEhrClientId"
                    value="{{ehrVendorRecord.ehrClientId}}"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Supported Scopes</label>
                  {{#each ehrVendorRecord.scopeOptions}}
                    <div class="form-check">
                      <input
                        class="form-check-input ehrVendorScopeCheckbox"
                        type="checkbox"
                        value="{{token}}"
                        id="ehrVendorScope-{{@index}}"
                        {{#if checked}}checked{{/if}}
                      />
                      <label class="form-check-label" for="ehrVendorScope-{{@index}}">{{label}}</label>
                    </div>
                  {{/each}}
                </div>
                <div class="mb-3">
                  <label class="form-label">Auth Screen</label>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="ehrVendorSkipTypeChecklist"
                      {{#if ehrVendorRecord.skipTypeChecklist}}checked{{/if}}
                    />
                    <label class="form-check-label" for="ehrVendorSkipTypeChecklist"
                      >Skip</label
                    >
                  </div>
                  <div class="form-text">
                    Tick when the EHR's own authorization screen asks the patient which record types
                    to share (eg Epic MyChart). JHE then requests every supported scope. USCDI Patient Access only.
                  </div>
                </div>
                <div class="mb-3">
                  <label for="ehrVendorExtraScopes" class="form-label">Extra Scopes</label>
                  <input
                    type="text"
                    class="form-control"
                    id="ehrVendorExtraScopes"
                    value="{{ehrVendorRecord.extraScopes}}"
                  />
                  <div class="form-text">
                    Space-separated scopes requested in addition to
                    <code>openid fhirUser launch/patient</code>, for an EHR whose sign-in or records
                    need more (Epic: <code>profile</code>; Oracle Health: <code>patient/Binary.read</code>). USCDI Patient Access only.
                  </div>
                </div>
                <div class="mb-3">
                  <label for="ehrVendorScopeVersion" class="form-label">SMART Scopes</label>
                  <select class="form-select" id="ehrVendorScopeVersion">
                    {{#each ehrVendorRecord.scopeVersionOptions}}
                      <option value="{{value}}" {{#if selected}}selected{{/if}}>{{label}}</option>
                    {{/each}}
                  </select>
                  <div class="form-text">
                    The SMART App Launch version the EHR spells its scopes in: v1
                    <code>patient/Observation.read</code>, v2 <code>patient/Observation.rs</code>. USCDI Patient Access only.
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Query Overrides</label>
                  <div id="ehrVendorQueryOverrides">
                    {{#each ehrVendorRecord.queryOverrideRows}}
                      {{> ehrVendorQueryOverrideRow}}
                    {{/each}}
                  </div>
                  <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addEhrVendorQueryOverrideRow()">
                    Add Override
                  </button>
                  <div class="form-text">
                    Replaces the search JHE runs for one kind of record, for an EHR that answers it differently (eg a
                    server whose documents carry no category: Documents <code>DocumentReference</code>). The search
                    must start with the row's resource type and be relative to the FHIR base. A row left blank is
                    dropped. USCDI Patient Access only.
                  </div>
                </div>
              </fieldset>
            </form>
            {{#if read}}
              <hr />
              <p class="mb-0">Brands and Locations</p>
              <p class="text-muted small">(Mouse over a brand for its URL, a location for its address)</p>
              <ul class="list-unstyled">
                {{#each ehrVendorRecord.brands}}
                  <li>
                    <details>
                      <summary title="{{fhirBaseUrl}}">{{name}} <span class="text-muted">({{locations.length}})</span></summary>
                      <ul class="icon-bullet-list">
                        {{#each locations}}
                          <li title="{{addressText}}">{{name}}{{#if city}}, {{city}}{{/if}}</li>
                        {{/each}}
                      </ul>
                    </details>
                  </li>
                {{/each}}
              </ul>
            {{/if}}
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="navReturnFromCrud()"
          >
            Close
          </button>
          {{#if create}}
            <button type="button" class="btn btn-primary" onclick="createEhrVendor()">Create</button>
          {{/if}}
          {{#if update}}
            <button type="button" class="btn btn-primary" onclick="updateEhrVendor({{ehrVendorRecord.id}})">Update</button>
          {{/if}}
          {{#if delete}}
            <button type="button" class="btn btn-danger" onclick="deleteEhrVendor({{ehrVendorRecord.id}})">Delete</button>
          {{/if}}
        </div>
      </div>
    </div>
  </div>
</script>

<script id="t-ehr-vendor-query-override-row" type="text/template">
  <div class="ehrVendorQueryOverride border rounded p-2 mb-2">
    <div class="d-flex gap-2">
      <select class="form-select form-select-sm ehrVendorQueryOverrideRow" aria-label="Query row" onchange="showEhrVendorQueryDefault(this)">
        {{#each options}}
          <option value="{{label}}" data-default="{{query}}" {{#if selected}}selected{{/if}}>{{label}}</option>
        {{/each}}
      </select>
      <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Remove override"
        onclick="this.closest('.ehrVendorQueryOverride').remove()">Remove</button>
    </div>
    <input type="text" class="form-control form-control-sm mt-2 ehrVendorQueryOverrideQuery" aria-label="Replacement search"
      value="{{query}}" placeholder="Replacement search" />
    <div class="form-text">Default: <code class="ehrVendorQueryDefault">{{defaultQuery}}</code></div>
  </div>
</script>
{% endverbatim %}
