{% verbatim %}
<script id="t-ehr-vendors" type="text/template">

  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col"></th>
        <th scope="col">ID</th>
        <th scope="col">Name</th>
        <th scope="col">Client ID</th>
        <th scope="col">Supported Scopes</th>
      </tr>
    </thead>
    <tbody>
      {{#ehrVendors}}
        <tr>
          <td>
            {{> crudButton iconRead=true recordId=id
              onclick="nav('ehrs',{
                id: this.dataset.recordid,
                read: true
              })"
            }}
            {{#if @root.canManageEhrVendors }}
                {{> crudButton iconUpdate=true recordId=id
                  onclick="nav('ehrs',{
                    id: this.dataset.recordid,
                    update: true
                  })"
                }}

                {{> crudButton iconDelete=true recordId=id
                  onclick="nav('ehrs',{
                    id: this.dataset.recordid,
                    delete: true
                  })"
                }}
            {{/if}}
          </td>
          <td>{{id}}</td>
          <td>{{name}}</td>
          <td>{{ehrClientId}}</td>
          <td>
            <ul>
            {{#each scopeLabels}}
              <li>{{this}}</li>
            {{/each}}
            </ul>
          </td>
        </tr>
      {{/ehrVendors}}
    </tbody>
  </table>
  {{#if @root.canManageEhrVendors }}
  <button type="button"
      class="btn btn-sm btn-success"
      onclick="nav('ehrs',{
          create: true
      })">
  Add EHR Vendor
  </button>
  {{/if}}

  <!-- MODAL -->
  <div
    class="modal fade"
    id="ehrs-crudModal"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    tabindex="-1"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">
            {{#if create}} Create EHR Vendor {{/if}}
            {{#if read}} View EHR Vendor {{/if}}
            {{#if update}} Update EHR Vendor {{/if}}
            {{#if delete}} Delete EHR Vendor {{/if}}
          </h1>
          <button
            type="button"
            class="btn-close"
            onclick="navReturnFromCrud()"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning validationError" style="display: none" role="alert"></div>
          <div class="container-fluid">
            {{#if delete}}
              <div class="alert alert-danger" role="alert">
                Are you sure you want to delete this entire record?
              </div>
            {{/if}}
            <form>
              <fieldset {{#if read }} disabled {{/if}} {{#if delete }} disabled {{/if}}>
                {{#unless create}}
                  <div class="mb-3">
                    <fieldset disabled>
                      <label for="ehrVendorId" class="form-label"
                        >ID</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="ehrVendorId"
                        value="{{ehrVendorRecord.id}}"
                      />
                    </fieldset>
                  </div>
                {{/unless}}
                <div class="mb-3">
                  <label for="ehrVendorName" class="form-label"
                    >Name*</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="ehrVendorName"
                    value="{{ehrVendorRecord.name}}"
                  />
                </div>
                <div class="mb-3">
                  <label for="ehrVendorEhrClientId" class="form-label"
                    >EHR Client ID</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="ehrVendorEhrClientId"
                    value="{{ehrVendorRecord.ehrClientId}}"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Supported Scopes</label>
                  {{#each ehrVendorRecord.scopeOptions}}
                    <div class="form-check">
                      <input
                        class="form-check-input ehrVendorScopeCheckbox"
                        type="checkbox"
                        value="{{token}}"
                        id="ehrVendorScope-{{@index}}"
                        {{#if checked}}checked{{/if}}
                      />
                      <label class="form-check-label" for="ehrVendorScope-{{@index}}">{{label}}</label>
                    </div>
                  {{/each}}
                </div>
              </fieldset>
            </form>
            {{#if read}}
              <hr />
              <p>Brands</p>
              <ul>
                {{#each ehrVendorRecord.brands}}
                  <li>{{name}} — {{fhirBaseUrl}}</li>
                {{/each}}
              </ul>
              <p>Locations</p>
              <ul>
                {{#each ehrVendorRecord.allLocations}}
                  <li><i class="bi bi-geo-alt-fill small"></i> {{brandName}}: {{name}} — {{addressText}}, {{state}}</li>
                {{/each}}
              </ul>
            {{/if}}
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="navReturnFromCrud()"
          >
            Close
          </button>
          {{#if create}}
            <button type="button" class="btn btn-primary" onclick="createEhrVendor()">Create</button>
          {{/if}}
          {{#if update}}
            <button type="button" class="btn btn-primary" onclick="updateEhrVendor({{ehrVendorRecord.id}})">Update</button>
          {{/if}}
          {{#if delete}}
            <button type="button" class="btn btn-danger" onclick="deleteEhrVendor({{ehrVendorRecord.id}})">Delete</button>
          {{/if}}
        </div>
      </div>
    </div>
  </div>
</script>
{% endverbatim %}
