[project]
name = "jupyterhealth-exchange"
version = "0.0.0"
description = "JupyterHealth Exchange - Django web application for sharing patient-consented medical data"
requires-python = ">=3.11"
dependencies = [
    "django==5.2.17",
    "python-dotenv",
    "psycopg2-binary",
    "django-oauth-toolkit",
    "six",
    "requests",
    # >=2.13 is the security floor: GHSA-xgmm-8j9v-c9wx et al. are fixed in 2.13.0
    "pyjwt[crypto]>=2.13",
    "djangorestframework",
    "gunicorn",
    "whitenoise",
    "djangorestframework-camel-case",
    "fhir.resources==7.1.0",
    "pydantic",
    "pyhumps",
    # [saml] pulls python3-saml for allauth.socialaccount.providers.saml (#697)
    "django-allauth[saml]",
    "faker",
    "drf-spectacular",
    "jsonschema",
    "ipython",
    "boto3",
    "omh-shim==2.1.0",
]

[dependency-groups]
dev = [
    "coverage",
    "responses",
    "pre-commit",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "pyyaml",
    "moto>=5.2.5",
    "hypothesis>=6.170.14",
    "ijson>=3.6.0",
    "mypy>=2.4.1",
    "import-linter>=2.15",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
# This is a Django application, not an installable package.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jhe.test_settings"
addopts = "--cov=core --cov=jhe"
markers = [
    "smoke: live deployment smoke tests (require --smoke-url)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "core/data",
    "core/migrations",
]

[tool.ruff.lint]
select = [
    "E9", # syntax
    # too much lint
    # "DJ", # pyflakes-django
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# JHE runs on Python 3.11 (the Dockerfile), which has no PEP 695 type-parameter syntax; ruff's
# target is 3.12, so it would suggest syntax the runtime rejects.
"patient_access/**" = ["UP046", "UP047"]

[tool.ruff.format]
exclude = [
    "migrations",
]

# The patient_access package is typed and checked strictly; JHE itself is not checked.
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["patient_access"]
exclude = ["patient_access/django_app/migrations/"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["django.*", "boto3", "boto3.*", "botocore.*", "rest_framework.*", "moto", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Django's own classes are untyped without django-stubs: subclassing them is Any by necessity.
module = ["patient_access.django_app.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The layering of the patient_access package (`uv run lint-imports`).
[tool.importlinter]
root_packages = ["patient_access"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core depends on nothing else in the package"
type = "forbidden"
source_modules = ["patient_access.core"]
forbidden_modules = [
    "patient_access.formatters",
    "patient_access.destinations",
    "patient_access.spool",
    "patient_access.dispatch",
    "patient_access.django_app",
    "patient_access.testing",
]

[[tool.importlinter.contracts]]
name = "only django_app uses Django"
type = "forbidden"
source_modules = [
    "patient_access.core",
    "patient_access.formatters",
    "patient_access.destinations",
    "patient_access.spool",
    "patient_access.dispatch",
    "patient_access.testing",
]
forbidden_modules = ["django", "rest_framework"]

[[tool.importlinter.contracts]]
name = "core does not use boto3"
type = "forbidden"
source_modules = ["patient_access.core", "patient_access.formatters", "patient_access.spool"]
forbidden_modules = ["boto3", "botocore"]
